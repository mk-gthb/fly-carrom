<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fly / Carrom</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header class="top"><a class="wordmark" href="/">FLY / CARROM</a></header>
<main>
 <section class="intro"><h1>Can a fly <em>play carrom?</em></h1><p class="caption">Teaching a fruit-fly connectome to play carrom.</p></section>
 <section class="stage"><div class="stage-head"><span>BOARD</span><span id="telemetry">ready</span></div><div id="scene" role="img" aria-label="WebGL 3D carrom board and modeled fly"></div></section>
 <section class="controls"><div class="control-col"><p class="label">SHOT</p><label>angle <output id="angleOut">0°</output><input id="angle" type="range" min="-50" max="50" value="0"></label><label>power <output id="powerOut">0.90</output><input id="power" type="range" min="20" max="100" value="90"></label><label>striker <output id="strikerOut">0.00</output><input id="striker" type="range" min="-70" max="70" value="0"></label><div class="buttons"><button id="shoot">SHOOT</button><button class="quiet" id="baseline">AIM</button></div></div><div class="control-col fly-col"><p class="label">FLY</p><p id="flyStatus" class="fly-status">Ready</p><div class="buttons"><button id="train">TRAIN</button><button class="quiet" id="flyShot">FLY SHOT</button></div></div><div class="score"><div><strong id="shots">0</strong><span>shots</span></div><div><strong id="potted">0</strong><span>potted</span></div></div></section>
</main><script type="module" src="/static/app.js"></script><script src="/static/controls-fallback.js"></script></body></html>
